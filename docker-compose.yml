services:
  sandbox:
    build:
      context: .
      dockerfile: sandbox/Dockerfile
      args:
        DOCKER_REGISTRY: ${DOCKER_REGISTRY:-docker.io/library}
        APT_MIRROR: ${APT_MIRROR:-deb.debian.org}
        NODE_MIRROR: ${NODE_MIRROR:-https://nodejs.org/dist}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple/}
        INSTALL_TOOLCHAIN: ${INSTALL_TOOLCHAIN:-false}
        INSTALL_BROWSER: ${INSTALL_BROWSER:-false}
    image: ${DSH_IMAGE_REPO:-dsh-sandbox}:${DSH_IMAGE_TAG:-latest}
    container_name: ${CONTAINER_NAME:-dsh-sandbox}
    restart: unless-stopped
    init: true
    ports:
      - "${HOST_PORT:-8080}:8080"
      # Expose 443 when SITE_ADDRESS is configured for Caddy automatic HTTPS:
      # - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: ${TZ:-UTC}
      SITE_ADDRESS: ${SITE_ADDRESS:-}
      PUBLIC_SCHEME: ${PUBLIC_SCHEME:-http}
      DSH_PUBLIC_URL: ${DSH_PUBLIC_URL:-}
      CADDY_AUTH_MODE: ${CADDY_AUTH_MODE:-none}
      CADDY_AUTH_USER: ${CADDY_AUTH_USER:-admin}
      CADDY_AUTH_PASSWORD: ${CADDY_AUTH_PASSWORD:-}
      CADDY_AUTH_PASSWORD_HASH: ${CADDY_AUTH_PASSWORD_HASH:-}
      CADDY_FORWARD_AUTH_URL: ${CADDY_FORWARD_AUTH_URL:-http://oauth2-proxy:4180}
    volumes:
      - dsh-home:/home/workspace
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3

  # Optional OAuth2 / OIDC SSO sidecar when CADDY_AUTH_MODE=forward_auth:
  # docker compose --profile oauth up -d
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.1
    container_name: ${CONTAINER_NAME:-dsh-sandbox}-oauth2-proxy
    profiles: ["oauth"]
    restart: unless-stopped
    environment:
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_PROVIDER: ${OAUTH2_PROXY_PROVIDER:-oidc}
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${OAUTH2_PROXY_OIDC_ISSUER_URL:-}
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_PROXY_CLIENT_ID:-}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET:-}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:-}
      OAUTH2_PROXY_REDIRECT_URL: ${OAUTH2_PROXY_REDIRECT_URL:-}
      OAUTH2_PROXY_EMAIL_DOMAINS: ${OAUTH2_PROXY_EMAIL_DOMAINS:-*}
      OAUTH2_PROXY_COOKIE_SECURE: ${OAUTH2_PROXY_COOKIE_SECURE:-false}
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_PASS_USER_HEADERS: "true"
      OAUTH2_PROXY_REVERSE_PROXY: "true"

volumes:
  dsh-home:
